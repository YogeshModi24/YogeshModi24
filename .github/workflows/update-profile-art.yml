name: Update profile art

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:        # allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt requests

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: YogeshModi24
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Update stats card
        env:
          GH_PROFILE_USER: YogeshModi24
        run: python scripts/make_stats_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats-card.svg data/contributions.json
          git diff --staged --quiet || git commit -m "Auto-update contribution graph and stats [skip ci]"
          git push
